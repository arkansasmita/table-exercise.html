<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <h1>Create  Form in HTML</h1>
    <form>
        <h2>Student Registration</h2>
        <label> Full Name</label><br>
        <input type="text" name="name" placeholder="Enter Your Name" required><br><br>

        <label> Email</label><br>
        <input type="email" name="email" placeholder="Enter Your E-mail" required><br><br>

        <label> Password</label><br>
        <input type="password" name="password" placeholder="Enter Your Password" required><br><br>

        <label> Date of Birth</label><br>
        <input type="date" name="birthday" required><br><br>

        <label> Class</label><br>
        <select>
            <option>X-1</option>
            <option>X-2</option> 
            <option>X-3</option>
        </select><br><br>

        <label> Gender</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label> Skills</label><br>
        <input type="checkbox" name="skills"> HTML
        <input type="checkbox" name="skills"> CSS
        <input type="checkbox" name="skills"> JavaScript<br><br>

        <label> About Yourself</label><br>
        <textarea name="about" rows="5" cols="40" placeholder="Write about yourself here...." required></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
