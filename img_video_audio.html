<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <!--image-->
    <h2>Image in HTML</h2>
    <img src="foto bareng.jpg" width="150" height="150" alt="Image"><br>
    <img src="logo.png" width="150" height="150" alt="abbs logo">

    <!--Audio-->
    <h2>Audio in HTML</h2>
    <audio controls> 
        <source src="paundra 2 detik.ogg" type="audio/ogg">
    </audio>

    <!--Video-->
    <h2>Video in HTML</h2>
    <video width="320" height="240" poster="ict.jpeg" controls>
        <source src="video.mp4" type="video/mp4">
    </video><br>
    <iframe width="320" height="240" src="https://www.youtube.com/embed/h2xYrzd_v-k?si=yO7560lnjk4hLUJL" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
